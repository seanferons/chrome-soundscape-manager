<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chrome Soundscape Manager</title>
    <link rel="stylesheet" href="options.css" />
    <script src="options.js" defer></script>
  </head>
  <body>
    <h1>Soundscape</h1>
    <p id="soundscape-empty">
      Nothing here yet. Press Option+S to make the current window the
      soundscape. Media already playing in that window, and media that starts
      there later, is part of it. Option+S in another window pauses the
      previous one and moves the soundscape. Option+P pauses or resumes it.
    </p>
    <ul id="soundscape"></ul>
    <p><button id="shortcuts" type="button">Edit shortcuts</button></p>
  </body>
</html>
